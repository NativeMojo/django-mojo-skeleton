name: Deploy
#
# Fires on every push to main: calls apps/system's /api/system/update, which
# broadcasts to every node running jobman (see system/rest/update.py) and
# each one runs aws/update.sh.
#
# Setup:
#   1. Replace yourdomain.com below with your real domain.
#   2. Add a repo secret SYSTEM_UPDATE_TOKEN with the same value as
#      SYSTEM_UPDATE_TOKEN in var/deploy.json (Settings -> Secrets and
#      variables -> Actions).
#
# No test step here on purpose — this project's tests need Postgres/Valkey,
# which is more CI setup than a small project wants. Run `bin/run_tests`
# locally before merging to main; this workflow trusts that gate.

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger fleet update
        run: |
          curl -sf -X POST https://yourdomain.com/api/system/update \
            -H "Authorization: apikey ${{ secrets.SYSTEM_UPDATE_TOKEN }}" \
            --max-time 10
