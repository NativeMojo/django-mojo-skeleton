# HTTP -> HTTPS redirect
server {
    listen 80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Upstream
upstream asgi_upstream {
    server unix:///opt/api/var/asgi.sock;
}

# HTTPS — update server_name and ssl_certificate paths after running certbot
server {
    listen 443 ssl default_server;
    http2 on;

    server_name yourdomain.com;          # <-- change this

    set $rootdir /opt/api;

    # Certificates — point at the self-signed placeholder (created by
    # ec2_deploy.sh) so nginx can start before a real cert exists. On a
    # SINGLE node, `certbot --nginx -d yourdomain.com` rewrites these lines to
    # the real /etc/letsencrypt/live/... paths; no manual edit needed.
    #
    # On a FLEET this vhost is not where certificates come from. dnsman issues
    # them (DNS-01, keys held in KMS) and mojo.apps.edge renders a vhost per
    # domain into a generation under /opt/api/var/edge, validates it, and
    # installs it on every node — reached through the one-line
    # conf.d/mojo.conf include. Leave this file on the placeholder and let the
    # edge plane own the real names.
    #
    # Whatever the path: never add `include /etc/letsencrypt/options-ssl-nginx.conf`
    # here. --nginx injects it (plus an ssl_dhparam line) and the file exists
    # only where certbot ran, so the moment this vhost reaches a second node
    # `nginx -t` fails there and the node serves nothing. The TLS settings
    # below are deliberately self-contained for exactly that reason.
    ssl_certificate /etc/nginx/ssl/snakeoil.crt;
    ssl_certificate_key /etc/nginx/ssl/snakeoil.key;

    # Modern TLS
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers on;
    ssl_ecdh_curve X25519:secp256r1;

    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    resolver 1.1.1.1 1.0.0.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    server_tokens off;
    keepalive_timeout 15s;
    keepalive_requests 1000;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer-when-downgrade always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Bot blocking
    if ($bad_bot) { return 444; }

    # Custom error pages (served from /opt/www/errors/)
    error_page 502 503 504 /errors/50x.html;
    location /errors/ {
        internal;
        root /opt/www;
    }

    include /etc/nginx/django.inc;
}
