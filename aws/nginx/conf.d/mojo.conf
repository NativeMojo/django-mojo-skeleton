# The django-mojo edge plane's rendered http base, its upstreams, and the
# vhosts that reference both.
#
# BOTH LINES ARE REQUIRED, IN THIS ORDER. A bootstrap that includes only conf.d
# stages files, passes `nginx -t`, reloads, and reports the generation
# installed — while serving none of it, because every `proxy_pass
# http://edge_up_N` names an upstream block nginx never read. nginx reports
# that as "host not found in upstream", which reads like DNS and is not.
#
# http.d/00_base.conf is included too, not just the upstreams: every rendered
# 443 block carries `if ($edge_block_ip)` and `if ($edge_block_ua)`
# unconditionally, and those maps live in the base. That is why this node's
# nginx.conf declares almost nothing at http level — see the split documented
# there and in django-mojo docs/django_developer/edge/templates.md.
#
# Day 0 is safe: before the first convergence `current/` does not exist and
# both globs match nothing.
include /opt/api/var/edge/current/http.d/*.conf;
include /opt/api/var/edge/current/conf.d/*.conf;
