# The node bootstrap. Small on purpose: django-mojo's edge plane owns the http
# level, and this file owns only the handful of directives that must exist
# BEFORE the first convergence.
#
# THE SPLIT, and why it is where it is. The rendered http base
# (current/http.d/00_base.conf) declares the mime include, log_format main,
# $loggable, access_log, the blocklist maps and the hardening knobs. Declaring
# any of them here as well is a duplicate-directive [emerg], so they are gone.
# What stays is what a node needs with no generation on disk at all:
# default_type, types_hash_max_size, and the $connection_upgrade map — the
# classic app.conf vhost below proxies through asgi.inc, which references that
# map, and a fresh box has to start nginx before it can converge.
#
# See django-mojo docs/django_developer/edge/templates.md for the full include
# graph and for the smaller bootstrap a fleet uses once the edge plane serves
# every host and conf.d/app.conf is gone.

user             www;
worker_processes auto;

error_log        /var/log/nginx/error.log info;
pid              /run/nginx.pid;

events {
    worker_connections 5024;
}

http {
    default_type        application/octet-stream;
    types_hash_max_size 4096;

    # Bootstrap-owned. See the note above: the rendered base deliberately does
    # not emit this, so that a node with a classic vhost can start on day 0.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Security maps
    include /etc/nginx/sec.d/*.conf;

    # The project's own vhosts, and — through conf.d/mojo.conf — the edge
    # plane's generated http base, upstreams and vhosts.
    include /etc/nginx/conf.d/*.conf;
}
