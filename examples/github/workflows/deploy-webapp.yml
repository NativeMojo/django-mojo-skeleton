# Copy this file to .github/workflows/deploy-webapp.yml in a WebApp repository.
# It is intentionally inactive while it remains under examples/.
name: Deploy WebApp

on:
  push:
    branches:
      - main # Replace with the repository's deployment branch when different.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-webapp-${{ vars.MOJO_WEBAPP_ID }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy WebApp
        uses: NativeMojo/django-mojo/examples/github/actions/deploy-webapp@v1
        with:
          api-url: ${{ vars.MOJO_API_URL }}
          webapp-id: ${{ vars.MOJO_WEBAPP_ID }}
          artifact-dir: dist
          version: ${{ github.sha }}
        env:
          MOJO_DEPLOY_KEY: ${{ secrets.MOJO_DEPLOY_KEY }}
